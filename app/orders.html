<!DOCTYPE html>
<!-- =========================================================================
  CafeFlow — จัดการออเดอร์ (§7, §8, §19)
  โครง: .ds-shell.cols-3 → ต้องมี class="ds-shell-page" ที่ <body>
  หน้านี้เป็นบ้านหลักของ print-preview drawer
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeFlow — จัดการออเดอร์</title>

    <link rel="stylesheet" href="../design-system-2/css/ds-tokens.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-base.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-navbar.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-layout.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-components.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-overlays.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-print.css">
    <link rel="stylesheet" href="css/ds-cafeflow-theme.css">
    <link rel="stylesheet" href="css/cf-app.css">

    <script src="../shared/cf-consts.js"></script>
    <script src="../shared/cf-flow.js"></script>
    <script src="../shared/cf-pricing.js"></script>
    <script src="../shared/cf-rules.js"></script>
    <script src="../shared/cf-perms.js"></script>
    <script src="js/cf-store.js"></script>
    <script src="js/cf-auth.js"></script>
    <script src="js/cf-api.js"></script>
    <script src="js/cf-boot.js"></script>
    <script>CFBoot.gate();</script>
</head>
<body data-page="orders" class="ds-shell-page">

<nav id="appNavbar"></nav>

<div class="ds-shell cols-3" id="shell">

    <!-- ══════ ซ้าย: รายการออเดอร์ ══════ -->
    <aside class="ds-pane-left" id="paneLeft">
        <div class="ds-pane-header">
            <h3><i data-lucide="receipt" class="mi"></i> ออเดอร์</h3>
            <span class="ds-pane-count" id="listCount">0</span>
        </div>
        <!-- ค้นหาอยู่บนสุด (ใช้บ่อยสุด) · วัน + เรียงลำดับแถวเดียว · ตัวกรองสถานะแถวเดียวเลื่อนได้
             — เดิมซ้อน 6 ชั้นจนเห็นออเดอร์แค่ 4 ใบ -->
        <div class="cf-ol-tools">
            <input class="ds-pane-search" id="listSearch" placeholder="ค้นหาเลขออเดอร์ / เมนู / คีออสก์"
                   oninput="OrdersPage.setQuery(this.value)">
            <div class="cf-ol-row">
                <select class="sip-select" id="daySelect" onchange="OrdersPage.setDay(this.value)">
                    <option value="today">วันนี้</option>
                    <option value="yesterday">เมื่อวาน</option>
                    <option value="pick">เลือกวัน…</option>
                </select>
                <select class="sip-select" id="groupSelect" onchange="OrdersPage.setGroup(this.value)">
                    <option value="recent">ใหม่สุด</option>
                    <option value="oldest">เก่าสุด</option>
                    <option value="amount">ยอดสูงสุด</option>
                </select>
            </div>
            <input type="date" class="sip-input" id="dayPick" style="display:none"
                   onchange="OrdersPage.loadDay(this.value)">
            <div class="cf-ol-dayinfo" id="dayInfo"></div>
        </div>
        <div class="ds-pilltabs cf-ol-pills" id="pillTabs"></div>
        <div class="ds-pane-scroll" id="listContainer"></div>
    </aside>

    <!-- ══════ กลาง: รายละเอียด ══════ -->
    <main class="ds-pane-main" id="paneMain">

        <div class="ds-empty-state" id="emptyState">
            <div class="ds-empty-state-icon"><i data-lucide="receipt-text"></i></div>
            <div class="ds-empty-state-title">เลือกออเดอร์จากรายการทางซ้าย</div>
            <div class="ds-empty-state-desc">เพื่อดูรายการสินค้า การชำระเงิน และประวัติการทำงาน</div>
        </div>

        <div id="detailWrap" style="display:none">
            <div class="ds-context-bar">
                <button class="ds-pane-toggle" onclick="OrdersPage.toggleLeft()" title="ซ่อน/แสดงรายการ">
                    <i data-lucide="panel-left" class="icon-sm"></i>
                </button>
                <div class="ds-context-avatar" id="ctxAvatar"></div>
                <div class="ds-context-info">
                    <div class="ds-context-name">
                        <span id="ctxNo">—</span>
                        <span id="ctxChip"></span>
                    </div>
                    <div class="cf-facts" id="ctxFacts"></div>
                </div>
                <div class="ds-context-aside" id="ctxAside"></div>
            </div>

            <!-- ไม่มีแท็บ — สินค้า · การชำระ · ประวัติ เห็นพร้อมกันในหน้าเดียว (เดิมตรงกลางว่างเกือบทั้งจอ) -->
            <div class="cf-od-body">
                <div class="cf-steps" id="stepper"></div>

                <section class="cf-od-card">
                    <div class="cf-od-title"><i data-lucide="coffee" class="icon-sm"></i> รายการสินค้า</div>
                    <div id="tabItems"></div>
                </section>

                <div class="cf-od-grid">
                    <section class="cf-od-card">
                        <div class="cf-od-title"><i data-lucide="wallet" class="icon-sm"></i> การชำระเงิน</div>
                        <div id="tabPayment"></div>
                    </section>
                    <section class="cf-od-card">
                        <div class="cf-od-title"><i data-lucide="history" class="icon-sm"></i> ประวัติ
                            <span class="tab-notif" id="auditBadge">0</span></div>
                        <div class="ds-timeline" id="auditList"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- ══════ ขวา: การดำเนินการ ══════ -->
    <aside class="ds-pane-right" id="paneRight">
        <div class="ds-pane-header"><h3>การดำเนินการ</h3></div>
        <div class="ds-pane-scroll" id="actionPane">
            <div class="ds-empty-sm">ยังไม่ได้เลือกออเดอร์</div>
        </div>
    </aside>

</div>

<div id="toastContainer" class="toast-container"></div>
<div id="dsPrintStage"></div>

<!-- ไอคอนเก็บไว้ในเครื่อง — ร้านต้องใช้ได้แม้เน็ตหลุด (ds-icons.js จะไม่ไปโหลดจาก CDN เมื่อมี window.lucide แล้ว) -->
<script src="vendor/lucide.min.js"></script>
<script src="../design-system-2/js/ds-icons.js"></script>
<script src="../design-system-2/js/ds-navbar.js"></script>
<script src="../design-system-2/js/ds-drawer.js"></script>
<script src="../design-system-2/js/ds-toast.js"></script>

<script src="js/cf-orders.js"></script>
<script src="js/cf-kpi.js"></script>
<script src="js/cf-print.js"></script>
<script src="js/cf-docs.js"></script>
<script src="js/cf-export.js"></script>
<script src="js/cf-nav.js"></script>
<script src="js/cf-app.js"></script>
<script>window.CF_DEVICE_ID = 'CASHIER-01';</script>
<script src="js/page-orders.js"></script>
</body>
</html>
