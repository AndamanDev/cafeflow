<!DOCTYPE html>
<!-- =========================================================================
  CafeFlow — ภาพรวมผู้จัดการ (§25, §26)
  โครง: .page-container (หน้าเลื่อนปกติ — ห้ามใส่ ds-shell-page)
  ========================================================================= -->
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeFlow — ภาพรวม</title>

    <link rel="stylesheet" href="../design-system-2/css/ds-tokens.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-base.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-navbar.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-layout.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-components.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-overlays.css">
    <link rel="stylesheet" href="../design-system-2/css/ds-print.css">
    <link rel="stylesheet" href="css/ds-cafeflow-theme.css">
    <link rel="stylesheet" href="css/cf-app.css">

    <script src="../shared/cf-consts.js"></script>
    <script src="../shared/cf-flow.js"></script>
    <script src="../shared/cf-pricing.js"></script>
    <script src="../shared/cf-rules.js"></script>
    <script src="../shared/cf-perms.js"></script>
    <script src="js/cf-store.js"></script>
    <script src="js/cf-auth.js"></script>
    <script src="js/cf-api.js"></script>
    <script src="js/cf-boot.js"></script>
    <script>CFBoot.gate();</script>
</head>
<body data-page="dashboard">

<nav id="appNavbar"></nav>

<div class="page-container">

    <div class="page-header">
        <div>
            <div class="page-title">
                <i data-lucide="layout-dashboard" class="mi"></i>
                <span>ภาพรวมการปฏิบัติงาน</span>
            </div>
            <div class="page-subtitle" id="shiftLine">—</div>
        </div>
    </div>

    <!-- เตือนผู้จัดการเมื่อมีเครื่องหลุดการจับคู่ (ค้างหน้าขอรหัส) — DashPage.renderDevWaits() -->
    <div id="devWaitBanner" style="display:none;margin-bottom:14px"></div>

    <!-- เตือนเมื่อไม่ได้สำรองข้อมูลนานเกิน 2 วัน -->
    <div id="backupBanner" style="display:none;margin-bottom:14px"></div>

    <!-- เตือนแอดมินเมื่อยังมีบัญชีใช้รหัสตั้งต้น -->
    <div id="weakPwBanner" style="display:none;margin-bottom:14px"></div>

    <!-- ยอดขาย (§25) — ตัวเลขที่เจ้าของร้านดูก่อนเสมอ จึงใหญ่สุด -->
    <div class="cf-dash-sales" id="kpiSales"></div>

    <!-- ตอนนี้ในร้าน — งานค้างที่ต้องมีคนจัดการ + ความเร็วการบริการ -->
    <div class="cf-dash-label">ตอนนี้ในร้าน</div>
    <div class="cf-dash-ops" id="kpiOps"></div>

    <div class="cf-dash-main">
        <div class="section-card cf-dash-activity">
            <div class="section-header">
                <div class="section-title">
                    <i data-lucide="activity" class="mi"></i> กิจกรรมล่าสุด
                </div>
                <div class="section-actions">
                    <a class="btn btn-outline btn-sm" href="orders.html">
                        ดูออเดอร์ทั้งหมด <i data-lucide="arrow-right" class="icon-sm"></i>
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="cf-activity" id="activity"></div>
            </div>
        </div>

        <div class="cf-dash-side">
            <div class="clinical-card">
                <div class="card-title">ภาระงานแต่ละสถานี</div>
                <div id="stationLoad"></div>
                <div class="card-footer">นับเฉพาะออเดอร์ที่ยังอยู่ในสายการผลิต</div>
            </div>
            <div class="clinical-card">
                <div class="card-title">สินค้าหมดวันนี้</div>
                <div id="soldOut"></div>
            </div>
            <div class="clinical-card">
                <div class="card-title">ตั้งค่าร้าน</div>
                <div class="cf-dash-tools">
                    <button class="cf-tool" onclick="DashPage.openDevices()">
                        <i data-lucide="monitor"></i><span>อุปกรณ์</span></button>
                    <button class="cf-tool" data-role-gate="ADMIN MANAGER" id="btnPrinters" onclick="DashPage.openPrinters()">
                        <i data-lucide="printer"></i><span>เครื่องพิมพ์</span></button>
                    <button class="cf-tool" data-role-gate="ADMIN MANAGER" onclick="DashPage.openSlipAccuracy()">
                        <i data-lucide="scan-text"></i><span>ตรวจสลิป</span></button>
                    <button class="cf-tool" data-role-gate="ADMIN MANAGER" onclick="DashPage.openShop()">
                        <i data-lucide="store"></i><span>ข้อมูลร้าน</span></button>
                    <button class="cf-tool" data-role-gate="ADMIN MANAGER" onclick="DashPage.openKioskSettings()">
                        <i data-lucide="tablet-smartphone"></i><span>คีออสก์</span></button>
                    <button class="cf-tool" data-role-gate="ADMIN" onclick="DashPage.openUsers()">
                        <i data-lucide="users"></i><span>ผู้ใช้และสิทธิ์</span></button>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="toastContainer" class="toast-container"></div>
<div id="dsPrintStage"></div>

<!-- ไอคอนเก็บไว้ในเครื่อง — ร้านต้องใช้ได้แม้เน็ตหลุด (ds-icons.js จะไม่ไปโหลดจาก CDN เมื่อมี window.lucide แล้ว) -->
<script src="vendor/lucide.min.js"></script>
<script src="../design-system-2/js/ds-icons.js"></script>
<script src="../design-system-2/js/ds-navbar.js"></script>
<script src="../design-system-2/js/ds-drawer.js"></script>
<script src="../design-system-2/js/ds-toast.js"></script>

<script src="js/cf-orders.js"></script>
<script src="js/cf-kpi.js"></script>
<script src="js/cf-print.js"></script>
<script src="js/cf-docs.js"></script>
<script src="js/cf-export.js"></script>
<script src="js/cf-nav.js"></script>
<script src="js/cf-app.js"></script>
<script src="js/cf-alerts.js"></script>
<script src="js/page-dashboard.js"></script>
</body>
</html>
